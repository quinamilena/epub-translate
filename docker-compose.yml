version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: epub-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Descomente abaixo se tiver GPU NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: epub-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./backend/tmp:/app/tmp
      - ./backend/glossaries:/app/glossaries
      - ./backend/.env:/app/.env
    environment:
      - TRANSLATION_PROVIDER=ollama
      - TRANSLATION_MODEL=llama3.1
      - TRANSLATION_BASE_URL=http://ollama:11434
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: epub-frontend
    ports:
      - "5500:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
